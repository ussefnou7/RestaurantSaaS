spring:
  application:
    name: restaurant-saas
  # Test datasource. The default must never be the development database: a fresh clone with
  # no environment set has to be safe without a manual step, because a manual safety step is
  # a step that gets skipped. CI and any other environment override via SPRING_DATASOURCE_*.
  # Create the local database once with: createdb restaurant_saas_test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurant_saas_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Session-level lock-acquisition cap on every pooled connection (integer = milliseconds).
      # Converts an indefinite lock wait — e.g. a REQUIRES_NEW step requesting a row its own
      # outer transaction holds, which PostgreSQL's deadlock detector cannot see — into a failed
      # statement that rolls back and releases the connection. Lock acquisition only:
      # deliberately NOT statement_timeout, which would kill long-running legitimate work
      # (reports, the consumption scheduler's per-material loop).
      connection-init-sql: SET lock_timeout = ${SPRING_DATASOURCE_LOCK_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      enabled: false
    validate-on-migrate: false
    clean-disabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs

server:
  port: ${PORT:${SERVER_PORT:2020}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}

order-consumption:
  batching:
    # D58: a warehouse's PENDING consumption doc is batched when EITHER the number of
    # unprocessed lines reaches threshold-count OR the doc's oldest line exceeds max-age.
    # Both are tunable operational parameters, not architectural constants.
    threshold-count: ${ORDER_CONSUMPTION_BATCH_THRESHOLD:50}
    max-age: ${ORDER_CONSUMPTION_BATCH_MAX_AGE:8h}
    # How often the scheduler polls for warehouses crossing either threshold.
    poll-interval: ${ORDER_CONSUMPTION_BATCH_POLL_INTERVAL:60s}
