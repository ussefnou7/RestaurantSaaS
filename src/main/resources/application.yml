spring:
  application:
    name: restaurant-saas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurant-saas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Session-level lock-acquisition cap on every pooled connection (integer = milliseconds).
      # Converts an indefinite lock wait — e.g. a REQUIRES_NEW step requesting a row its own
      # outer transaction holds, which PostgreSQL's deadlock detector cannot see — into a failed
      # statement that rolls back and releases the connection. Lock acquisition only:
      # deliberately NOT statement_timeout, which would kill long-running legitimate work
      # (reports, the consumption scheduler's per-material loop).
      connection-init-sql: SET lock_timeout = ${SPRING_DATASOURCE_LOCK_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
        enabled: false
    validate-on-migrate: false
    clean-disabled: false
  servlet:
    multipart:
      # D128 §10: the multipart ceiling is two limits, not one, and this is only the first.
      # The default is 1 MB, so a 10 MB PRODUCT_IMAGE would fail at 1 MB from a layer that
      # produces no errorCode for translateApiError to render -- the user sees an untranslated
      # container error page. Set above the largest purpose ceiling so the refusal comes from
      # MediaService, which names the purpose and its real limit.
      #
      # THE SECOND LIMIT IS NOT HERE. Any reverse proxy in front of the war has its own body
      # cap (nginx client_max_body_size defaults to 1 MB) and will reject the request before
      # Spring sees it. Whoever deploys this has to raise that too.
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:16MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:20MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs

server:
  port: ${PORT:${SERVER_PORT:2020}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:7}
  media:
    # D128 §7. THIS MUST BE AN ABSOLUTE PATH OUTSIDE THE DEPLOYED WAR IN ANY REAL DEPLOYMENT.
    # A path inside the servlet container is erased by the next deployment, and every product
    # image and employee photo goes with it. The relative default below is a development
    # convenience only.
    #
    # It also means pg_dump stops being a complete backup of this system: media is not in the
    # database. This root needs its own backup, and whoever operates the server has to be told.
    storage-root: ${APP_MEDIA_STORAGE_ROOT:./media-storage}
    deletion-queue:
      # Drains the storage keys of already-deleted rows. Lag here is harmless -- the rows are
      # gone, only the bytes linger -- so the interval is generous on purpose.
      enabled: ${APP_MEDIA_DELETION_QUEUE_ENABLED:true}
      poll-interval: ${APP_MEDIA_DELETION_QUEUE_POLL_INTERVAL:5m}
      batch-size: ${APP_MEDIA_DELETION_QUEUE_BATCH_SIZE:200}

order-consumption:
  batching:
    # D58: a warehouse's PENDING consumption doc is batched when EITHER the number of
    # unprocessed lines reaches threshold-count OR the doc's oldest line exceeds max-age.
    # Both are tunable operational parameters, not architectural constants.
    threshold-count: ${ORDER_CONSUMPTION_BATCH_THRESHOLD:50}
    max-age: ${ORDER_CONSUMPTION_BATCH_MAX_AGE:8h}
    # How often the scheduler polls for warehouses crossing either threshold.
    poll-interval: ${ORDER_CONSUMPTION_BATCH_POLL_INTERVAL:60s}
